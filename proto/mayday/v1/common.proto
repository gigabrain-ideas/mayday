syntax = "proto3";

package mayday.v1;

option java_multiple_files = true;
option java_package = "mayday.api.v1";

// Field names follow the JSON shape of the domain model. Enum values carry the
// type name as prefix (SEVERITY_SEV1); clients strip it (SEV1).

enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_SEV1 = 1;
  SEVERITY_SEV2 = 2;
  SEVERITY_SEV3 = 3;
  SEVERITY_SEV4 = 4;
  SEVERITY_SEV5 = 5;
}

enum ActorKind {
  ACTOR_KIND_UNSPECIFIED = 0;
  ACTOR_KIND_USER = 1;
  ACTOR_KIND_AGENT = 2;
  ACTOR_KIND_SYSTEM = 3;
}

message Actor {
  ActorKind kind = 1;
  string id = 2;
  string name = 3;
  optional string on_behalf_of = 4;
}

message IdRequest {
  string id = 1;
}
