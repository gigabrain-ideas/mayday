syntax = "proto3";

package mayday.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "mayday/v1/common.proto";
import "mayday/v1/identity.proto";

option java_multiple_files = true;
option java_package = "mayday.api.v1";

enum AgentKind {
  AGENT_KIND_UNSPECIFIED = 0;
  AGENT_KIND_INTERNAL = 1;
  AGENT_KIND_EXTERNAL = 2;
}

enum Delivery {
  DELIVERY_UNSPECIFIED = 0;
  DELIVERY_PUSH = 1;
  DELIVERY_PULL = 2;
}

enum AgentAction {
  AGENT_ACTION_UNSPECIFIED = 0;
  AGENT_ACTION_ANALYZE = 1;
  AGENT_ACTION_REMEDIATE = 2;
  AGENT_ACTION_PATCH = 3;
  AGENT_ACTION_TIMELINE = 4;
  AGENT_ACTION_POSTMORTEM = 5;
  AGENT_ACTION_RUNBOOK = 6;
}

enum TriggerEvent {
  TRIGGER_EVENT_UNSPECIFIED = 0;
  TRIGGER_EVENT_ALERT_CREATED = 1;
}

enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_QUEUED = 1;
  RUN_STATUS_DISPATCHED = 2;
  RUN_STATUS_RUNNING = 3;
  RUN_STATUS_SUCCEEDED = 4;
  RUN_STATUS_FAILED = 5;
  RUN_STATUS_CANCELLED = 6;
  // The agent reported a patch. Policy agents.patch_requires_approval holds it until a person approves or rejects it.
  RUN_STATUS_AWAITING_APPROVAL = 7;
  RUN_STATUS_REJECTED = 8;
}

enum RunTrigger {
  RUN_TRIGGER_UNSPECIFIED = 0;
  RUN_TRIGGER_AUTO = 1;
  RUN_TRIGGER_MANUAL = 2;
}

enum SubjectKind {
  SUBJECT_KIND_UNSPECIFIED = 0;
  SUBJECT_KIND_INCIDENT = 1;
  SUBJECT_KIND_ALERT = 2;
}

message AgentTrigger {
  TriggerEvent event = 1;
  Severity min_severity = 2;
  repeated string team_ids = 3;
  AgentAction action = 4;
}

message AgentConfig {
  string id = 1;
  string name = 2;
  string description = 3;
  AgentKind kind = 4;
  Delivery delivery = 5;
  optional string endpoint_url = 6;
  // "set" when the agent has a signing secret, else empty. The secret itself never leaves Mayday.
  string secret_sealed = 7;
  repeated AgentAction actions = 8;
  repeated AgentTrigger triggers = 9;
  OrgRole role = 10;
  bool enabled = 11;
  string instructions = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
}

message AgentConfigs {
  repeated AgentConfig items = 1;
}

message AgentInput {
  string name = 1;
  string description = 2;
  AgentKind kind = 3;
  Delivery delivery = 4;
  optional string endpoint_url = 5;
  repeated AgentAction actions = 6;
  repeated AgentTrigger triggers = 7;
  OrgRole role = 8;
  bool enabled = 9;
  string instructions = 10;
}

message UpdateAgentRequest {
  string id = 1;
  AgentInput agent = 2;
}

// The token secret and the signing secret are in this response only.
message AgentCredentials {
  AgentConfig agent = 1;
  IssuedToken token = 2;
  optional string signing_secret = 3;
}

message EligibleAgentsRequest {
  AgentAction action = 1;
}

message AgentRun {
  string id = 1;
  string agent_id = 2;
  string agent_name = 3;
  AgentAction action = 4;
  SubjectKind subject_kind = 5;
  string subject_id = 6;
  string subject_label = 7;
  RunStatus status = 8;
  RunTrigger trigger = 9;
  Actor requested_by = 10;
  optional string on_behalf_of = 11;
  string prompt = 12;
  string output = 13;
  string error = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp started_at = 16;
  google.protobuf.Timestamp finished_at = 17;
  // OpenTelemetry trace of the run. Empty when tracing is off.
  string trace_id = 18;
  // Policy agents.patch_requires_approval when the run started. Agents must not apply the patch before approval.
  bool requires_approval = 19;
  optional Actor approved_by = 20;
  google.protobuf.Timestamp approved_at = 21;
  // The approved runbook that an automatic run follows.
  optional string runbook_id = 22;
}

message AgentRuns {
  repeated AgentRun items = 1;
}

message ListRunsRequest {
  // Unset lists the most recent runs of all subjects.
  SubjectKind subject_kind = 1;
  // Incident key, number or id; or alert id.
  string subject_ref = 2;
  int32 limit = 3;
}

message StartRunRequest {
  SubjectKind subject_kind = 1;
  string subject_ref = 2;
  AgentAction action = 3;
  optional string agent_id = 4;
  string prompt = 5;
}

message ClaimRunsRequest {
  int32 limit = 1;
}

message ClaimedRun {
  AgentRun run = 1;
  optional string delegated_token = 2;
  google.protobuf.Struct subject = 3;
}

message ClaimedRuns {
  repeated ClaimedRun items = 1;
}

message RunProgressRequest {
  string id = 1;
  string text = 2;
}

message RejectRunRequest {
  string id = 1;
  string reason = 2;
}

message CompleteRunRequest {
  string id = 1;
  bool success = 2;
  string output = 3;
  string error = 4;
}

// API_KEY sends the credential as x-api-key (Anthropic style). BEARER sends Authorization: Bearer (OpenAI style).
enum AuthStyle {
  AUTH_STYLE_UNSPECIFIED = 0;
  AUTH_STYLE_API_KEY = 1;
  AUTH_STYLE_BEARER = 2;
}

// NONE: no auth header. STATIC: fixed API key. OAUTH2: short-lived token from any OAuth 2.0 token endpoint
// (client secret, or a workload identity assertion file). FILE: token that another process writes.
enum CredentialMode {
  CREDENTIAL_MODE_UNSPECIFIED = 0;
  CREDENTIAL_MODE_NONE = 1;
  CREDENTIAL_MODE_STATIC = 2;
  CREDENTIAL_MODE_OAUTH2 = 3;
  CREDENTIAL_MODE_FILE = 4;
}

// CLIENT_CREDENTIALS (RFC 6749): client secret, or the assertion file as JWT client assertion (RFC 7523).
// TOKEN_EXCHANGE (RFC 8693): the assertion file is the subject token.
enum GrantType {
  GRANT_TYPE_UNSPECIFIED = 0;
  GRANT_TYPE_CLIENT_CREDENTIALS = 1;
  GRANT_TYPE_TOKEN_EXCHANGE = 2;
}

// How the client secret goes to the token endpoint. BASIC: HTTP Basic (client_secret_basic). POST: form fields (client_secret_post).
enum ClientAuth {
  CLIENT_AUTH_UNSPECIFIED = 0;
  CLIENT_AUTH_BASIC = 1;
  CLIENT_AUTH_POST = 2;
}

message LlmView {
  // "anthropic" or "openai" (the API protocol of base_url).
  string provider = 1;
  string model = 2;
  string base_url = 3;
  string effort = 4;
  bool enabled = 5;
  bool has_api_key = 6;
  bool ready = 7;
  AuthStyle auth_style = 8;
  CredentialMode credential = 9;
  string token_url = 10;
  string client_id = 11;
  bool has_client_secret = 12;
  string assertion_file = 13;
  string token_file = 14;
  string scope = 15;
  reserved 16, 17;
  reserved "agent_id_header", "agent_id";
  // Custom headers on every gateway call, for example an agent registry id (x-company-agent-id).
  map<string, string> headers = 18;
  // LlmView field names (camelCase) that the environment sets. They cannot be changed through UpdateLlm.
  repeated string managed_fields = 19;
  // Set after the gateway answered HTTP 429. The agent makes no LLM call before this time.
  google.protobuf.Timestamp paused_until = 20;
  string pause_reason = 21;
  // OIDC issuer. Without token_url, Mayday reads the token endpoint from the issuer metadata.
  string issuer = 22;
  GrantType grant = 23;
  ClientAuth client_auth = 24;
  // Extra token request fields, for example audience or resource.
  map<string, string> token_params = 25;
}

// Unset fields keep their value. An empty api_key or client_secret removes the stored secret.
// Setting a managed field fails with INVALID_ARGUMENT.
message LlmInput {
  optional string model = 1;
  optional string api_key = 2;
  optional string base_url = 3;
  optional string effort = 4;
  optional bool enabled = 5;
  optional string provider = 6;
  optional AuthStyle auth_style = 7;
  optional CredentialMode credential = 8;
  optional string token_url = 9;
  optional string client_id = 10;
  optional string client_secret = 11;
  optional string assertion_file = 12;
  optional string token_file = 13;
  optional string scope = 14;
  reserved 15, 16;
  reserved "agent_id_header", "agent_id";
  // Replaces all fixed headers when replace_headers is true.
  map<string, string> headers = 17;
  bool replace_headers = 18;
  optional string issuer = 19;
  optional GrantType grant = 20;
  optional ClientAuth client_auth = 21;
  // Replaces all token parameters when replace_token_params is true. Reserved OAuth fields fail with INVALID_ARGUMENT.
  map<string, string> token_params = 22;
  bool replace_token_params = 23;
}

message McpServerView {
  string id = 1;
  string name = 2;
  string url = 3;
  string header_name = 4;
  bool has_credential = 5;
  repeated string tool_allowlist = 6;
  bool enabled = 7;
  // Send the identity headers of the LLM settings (token and custom headers) instead of header_name and credential.
  bool use_agent_identity = 8;
  reserved 9;
  reserved "scope";
}

message McpServerViews {
  repeated McpServerView items = 1;
}

message SaveMcpServerRequest {
  // Empty on create.
  string id = 1;
  string name = 2;
  string url = 3;
  string header_name = 4;
  // Unset keeps the stored credential. Empty removes it.
  optional string credential = 5;
  repeated string tool_allowlist = 6;
  bool enabled = 7;
  bool use_agent_identity = 8;
  reserved 9;
  reserved "scope";
}

service AgentService {
  rpc ListAgents(google.protobuf.Empty) returns (AgentConfigs);
  rpc ListEligibleAgents(EligibleAgentsRequest) returns (AgentConfigs);
  rpc GetAgent(IdRequest) returns (AgentConfig);
  rpc CreateAgent(AgentInput) returns (AgentCredentials);
  rpc UpdateAgent(UpdateAgentRequest) returns (AgentConfig);
  rpc DeleteAgent(IdRequest) returns (google.protobuf.Empty);
  rpc RotateAgentCredentials(IdRequest) returns (AgentCredentials);
  rpc GetLlm(google.protobuf.Empty) returns (LlmView);
  rpc UpdateLlm(LlmInput) returns (LlmView);
  rpc ListMcpServers(google.protobuf.Empty) returns (McpServerViews);
  rpc SaveMcpServer(SaveMcpServerRequest) returns (McpServerView);
  rpc DeleteMcpServer(IdRequest) returns (google.protobuf.Empty);
}

// People start and cancel runs. Agent identities claim, report and complete them.
service AgentRunService {
  rpc ListRuns(ListRunsRequest) returns (AgentRuns);
  rpc GetRun(IdRequest) returns (AgentRun);
  rpc StartRun(StartRunRequest) returns (AgentRun);
  rpc CancelRun(IdRequest) returns (AgentRun);
  rpc ClaimRuns(ClaimRunsRequest) returns (ClaimedRuns);
  rpc ReportProgress(RunProgressRequest) returns (AgentRun);
  rpc CompleteRun(CompleteRunRequest) returns (AgentRun);
  // A person only. The run must be AWAITING_APPROVAL.
  rpc ApproveRun(IdRequest) returns (AgentRun);
  rpc RejectRun(RejectRunRequest) returns (AgentRun);
}
