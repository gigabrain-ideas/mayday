syntax = "proto3";

package mayday.v1;

import "google/protobuf/empty.proto";

option java_multiple_files = true;
option java_package = "mayday.api.v1";

// Health of the audit stream on the instance that answers. Administrators only.
service AuditService {
  rpc GetAuditStatus(google.protobuf.Empty) returns (AuditStatus);
}

message AuditSinkStatus {
  // stdout, file, http, loki or sentinel.
  string name = 1;
  int64 delivered = 2;
  // Failed delivery attempts. Mayday retries a failed batch.
  int64 failures = 3;
  // Records lost because the sink buffer was full.
  int64 dropped = 4;
  int64 pending = 5;
  string last_error = 6;
}

message AuditStatus {
  string schema = 1;
  // Host name and boot id. Each instance has its own hash chain.
  string instance = 2;
  bool reads = 3;
  int64 accepted = 4;
  // Records lost because the queue was full. The stream reports them as audit.dropped.
  int64 dropped = 5;
  repeated AuditSinkStatus sinks = 6;
}
