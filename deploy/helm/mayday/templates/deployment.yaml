{{- if and (not .Values.database.url) (gt (int .Values.replicaCount) 1) }}
{{- fail "The journal store supports one replica. Set database.url or replicaCount: 1." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mayday.fullname" . }}
  labels: {{- include "mayday.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: {{ if .Values.database.url }}RollingUpdate{{ else }}Recreate{{ end }}
  selector:
    matchLabels: {{- include "mayday.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mayday.selector" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ toJson .Values | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "mayday.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: mayday
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: grpc, containerPort: 9090 }
          env:
            - { name: PORT, value: "8080" }
            - { name: MAYDAY_GRPC_PORT, value: "9090" }
            - { name: MAYDAY_PUBLIC_URL, value: {{ .Values.publicUrl | quote }} }
            - name: MAYDAY_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ include "mayday.secretName" . }}, key: secretKey } }
            {{- if .Values.database.url }}
            - { name: MAYDAY_DATABASE_URL, value: {{ .Values.database.url | quote }} }
            - { name: MAYDAY_DATABASE_USER, value: {{ .Values.database.user | quote }} }
            - { name: MAYDAY_DATABASE_POOL, value: {{ .Values.database.pool | quote }} }
            - name: MAYDAY_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "mayday.secretName" .) .Values.database.existingSecret }}
                  key: {{ if .Values.database.existingSecret }}password{{ else }}databasePassword{{ end }}
            {{- else }}
            - { name: MAYDAY_DATA_DIR, value: /data }
            {{- end }}
            {{- if .Values.oidc.issuer }}
            - { name: MAYDAY_OIDC_ISSUER, value: {{ .Values.oidc.issuer | quote }} }
            - { name: MAYDAY_OIDC_CLIENT_ID, value: {{ .Values.oidc.clientId | quote }} }
            - { name: MAYDAY_OIDC_SCOPES, value: {{ .Values.oidc.scopes | quote }} }
            - { name: MAYDAY_OIDC_AUDIENCES, value: {{ .Values.oidc.audiences | quote }} }
            - { name: MAYDAY_OIDC_GROUPS_CLAIM, value: {{ .Values.oidc.groupsClaim | default "groups" | quote }} }
            - name: MAYDAY_OIDC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "mayday.secretName" . }}, key: oidcClientSecret, optional: true } }
            {{- end }}
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: {{ include "mayday.secretName" . }}, key: anthropicApiKey, optional: true } }
            - { name: MAYDAY_ADMIN_EMAILS, value: {{ .Values.adminEmails | quote }} }
            - { name: MAYDAY_GROUPS_AUTO_CREATE, value: {{ .Values.groups.autoCreate | default false | quote }} }
            - { name: MAYDAY_GROUPS_FILTER, value: {{ .Values.groups.filter | default "" | quote }} }
            - { name: MAYDAY_GROUPS_OWNER_SUFFIX, value: {{ .Values.groups.ownerSuffix | default "" | quote }} }
            - { name: MAYDAY_DEV_LOGIN, value: {{ .Values.devLogin | quote }} }
            - { name: MAYDAY_DEMO, value: {{ .Values.demo | quote }} }
            {{- $l := .Values.llm }}
            {{- $model := dict "MAYDAY_LLM_PROVIDER" $l.provider "MAYDAY_LLM_MODEL" $l.model "MAYDAY_LLM_EFFORT" $l.effort "MAYDAY_LLM_ENABLED" (toString $l.enabled) }}
            {{- range $k := keys $model | sortAlpha }}
            {{- with get $model $k }}
            - { name: {{ $k }}, value: {{ . | quote }} }
            {{- end }}
            {{- end }}
            {{- if .Values.tokenProxy.enabled }}
            - { name: MAYDAY_LLM_BASE_URL, value: "http://127.0.0.1:{{ .Values.tokenProxy.port }}" }
            - { name: MAYDAY_LLM_CREDENTIAL, value: none }
            {{- else }}
            {{- with $l.baseUrl }}
            - { name: MAYDAY_LLM_BASE_URL, value: {{ . | quote }} }
            {{- end }}
            {{- include "mayday.llmIdentityEnv" . | trim | nindent 12 }}
            {{- end }}
            {{- with .Values.otel.endpoint }}
            - { name: MAYDAY_OTEL_ENDPOINT, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.otel.sampling }}
            - { name: MAYDAY_OTEL_SAMPLING, value: {{ . | quote }} }
            {{- end }}
            {{- if .Values.otel.captureContent }}
            - { name: MAYDAY_OTEL_CAPTURE_CONTENT, value: "true" }
            {{- end }}
            {{- with .Values.audit }}
            - { name: MAYDAY_AUDIT_SINKS, value: {{ .sinks | default "stdout" | quote }} }
            - { name: MAYDAY_AUDIT_READS, value: {{ ternary "true" "false" (ne .reads false) | quote }} }
            {{- with .file }}
            - { name: MAYDAY_AUDIT_FILE, value: {{ . | quote }} }
            {{- end }}
            {{- with .http.url }}
            - { name: MAYDAY_AUDIT_HTTP_URL, value: {{ . | quote }} }
            {{- end }}
            - { name: MAYDAY_AUDIT_HTTP_FORMAT, value: {{ .http.format | default "json" | quote }} }
            {{- with .loki.url }}
            - { name: MAYDAY_AUDIT_LOKI_URL, value: {{ . | quote }} }
            {{- end }}
            {{- with .loki.tenant }}
            - { name: MAYDAY_AUDIT_LOKI_TENANT, value: {{ . | quote }} }
            {{- end }}
            {{- with .loki.user }}
            - { name: MAYDAY_AUDIT_LOKI_USER, value: {{ . | quote }} }
            {{- end }}
            {{- with .loki.labels }}
            - { name: MAYDAY_AUDIT_LOKI_LABELS, value: {{ . | quote }} }
            {{- end }}
            {{- with .sentinel.endpoint }}
            - { name: MAYDAY_AUDIT_SENTINEL_ENDPOINT, value: {{ . | quote }} }
            {{- end }}
            {{- with .sentinel.dcrId }}
            - { name: MAYDAY_AUDIT_SENTINEL_DCR_ID, value: {{ . | quote }} }
            {{- end }}
            - { name: MAYDAY_AUDIT_SENTINEL_STREAM, value: {{ .sentinel.stream | default "Custom-MaydayAudit_CL" | quote }} }
            {{- with .sentinel.tenantId }}
            - { name: MAYDAY_AUDIT_SENTINEL_TENANT_ID, value: {{ . | quote }} }
            {{- end }}
            {{- with .sentinel.clientId }}
            - { name: MAYDAY_AUDIT_SENTINEL_CLIENT_ID, value: {{ . | quote }} }
            {{- end }}
            {{- with .sentinel.assertionFile }}
            - { name: MAYDAY_AUDIT_SENTINEL_ASSERTION_FILE, value: {{ . | quote }} }
            {{- end }}
            {{- end }}
            {{- $s := include "mayday.secretName" . }}
            {{- range $env, $key := dict "MAYDAY_AUDIT_KEY" "auditKey" "MAYDAY_AUDIT_LOKI_PASSWORD" "auditLokiPassword" "MAYDAY_AUDIT_LOKI_TOKEN" "auditLokiToken" "MAYDAY_AUDIT_SENTINEL_CLIENT_SECRET" "auditSentinelClientSecret" "MAYDAY_AUDIT_HTTP_HEADERS" "auditHttpHeaders" }}
            - name: {{ $env }}
              valueFrom: { secretKeyRef: { name: {{ $s }}, key: {{ $key }}, optional: true } }
            {{- end }}
            {{- with .Values.traceUrlTemplate }}
            - { name: MAYDAY_TRACE_URL_TEMPLATE, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if not .Values.database.url }}
            - { name: data, mountPath: /data }
            {{- end }}
            {{- if .Values.workloadIdentity.enabled }}
            - { name: workload-identity, mountPath: /var/run/secrets/mayday/workload-identity, readOnly: true }
            {{- end }}
        {{- if .Values.tokenProxy.enabled }}
        - name: token-proxy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["token-proxy"]
          env:
            - { name: MAYDAY_PROXY_UPSTREAM, value: {{ required "Set tokenProxy.upstream" .Values.tokenProxy.upstream | quote }} }
            - { name: MAYDAY_PROXY_LISTEN, value: "127.0.0.1:{{ .Values.tokenProxy.port }}" }
            {{- include "mayday.llmIdentityEnv" . | trim | nindent 12 }}
            {{- with .Values.tokenProxy.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources: {{- toYaml .Values.tokenProxy.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if .Values.workloadIdentity.enabled }}
            - { name: workload-identity, mountPath: /var/run/secrets/mayday/workload-identity, readOnly: true }
            {{- end }}
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.workloadIdentity.enabled }}
        - name: workload-identity
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ required "Set workloadIdentity.audience" .Values.workloadIdentity.audience | quote }}
                  expirationSeconds: {{ .Values.workloadIdentity.expirationSeconds }}
        {{- end }}
        {{- if not .Values.database.url }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim: { claimName: {{ include "mayday.fullname" . }} }
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
