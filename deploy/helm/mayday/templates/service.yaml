apiVersion: v1
kind: Service
metadata:
  name: {{ include "mayday.fullname" . }}
  labels: {{- include "mayday.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "mayday.selector" . | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
    {{- if .Values.grpc.enabled }}
    - { name: grpc, port: {{ .Values.service.grpcPort }}, targetPort: grpc, appProtocol: kubernetes.io/h2c }
    {{- end }}
