{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mayday.fullname" . }}
  labels: {{- include "mayday.labels" . | nindent 4 }}
type: Opaque
stringData:
  secretKey: {{ required "Set secretKey or existingSecret" .Values.secretKey | quote }}
  oidcClientSecret: {{ .Values.oidc.clientSecret | quote }}
  anthropicApiKey: {{ .Values.anthropicApiKey | quote }}
  databasePassword: {{ .Values.database.password | quote }}
  auditKey: {{ .Values.audit.auditKey | default "" | quote }}
  auditLokiPassword: {{ .Values.audit.loki.password | default "" | quote }}
  auditLokiToken: {{ .Values.audit.loki.token | default "" | quote }}
  auditSentinelClientSecret: {{ .Values.audit.sentinel.clientSecret | default "" | quote }}
  auditHttpHeaders: {{ .Values.audit.http.headers | default "" | quote }}
{{- end }}
