# Local trial with PostgreSQL. For production, set MAYDAY_SECRET_KEY and SSO, and turn off demo and dev login.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mayday
      POSTGRES_USER: mayday
      POSTGRES_PASSWORD: mayday
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mayday -d mayday"]
      interval: 5s
      timeout: 3s
      retries: 20

  mayday:
    build: .
    image: mayday:local
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"   # web, gRPC-Web, MCP, alert intake
      - "9090:9090"   # native gRPC
    environment:
      MAYDAY_PUBLIC_URL: http://localhost:8080
      MAYDAY_DATABASE_URL: postgresql://postgres:5432/mayday
      MAYDAY_DATABASE_USER: mayday
      MAYDAY_DATABASE_PASSWORD: mayday
      MAYDAY_SECRET_KEY: ${MAYDAY_SECRET_KEY:-change-me-to-a-long-random-value}
      MAYDAY_DEMO: ${MAYDAY_DEMO:-true}
      MAYDAY_DEV_LOGIN: ${MAYDAY_DEV_LOGIN:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Traces: MAYDAY_OTEL_ENDPOINT=http://jaeger:4318 docker compose --profile observability up
      MAYDAY_OTEL_ENDPOINT: ${MAYDAY_OTEL_ENDPOINT:-}
      MAYDAY_OTEL_CAPTURE_CONTENT: ${MAYDAY_OTEL_CAPTURE_CONTENT:-false}
      MAYDAY_TRACE_URL_TEMPLATE: ${MAYDAY_TRACE_URL_TEMPLATE:-http://localhost:16686/trace/{traceId}}

  # Trace UI on http://localhost:16686. Receives OTLP on 4317 (gRPC) and 4318 (HTTP).
  jaeger:
    image: jaegertracing/jaeger:2.5.0
    profiles: [observability]
    ports:
      - "16686:16686"
      - "4318:4318"

volumes:
  pgdata:
